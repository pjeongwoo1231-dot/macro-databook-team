# 매주 Data Book + 뉴스 다이제스트를 생성해 저장소에 커밋한다.
# 팀원은 이 저장소를 Obsidian 볼트로 열거나 Obsidian Git으로 pull하면 최신 데이터가 들어온다.
#
# ⚠ 2026-08-28 수정 — 이 워크플로는 그 전까지 **조용히 아무것도 안 하고 있었다.**
#   (1) 커밋 대상을 `Macro/`로 잡았는데, 볼트 출력 경로는 `04_DataBook/`이다.
#       `Macro/`는 로컬 output 디렉터리 안에서 쓰는 이름이라 저장소 루트엔 생기지 않는다.
#       (databook/render.py — 로컬 output은 "Macro", 볼트는 "04_DataBook")
#   (2) 게다가 `Macro/`는 .gitignore 대상이라, 설령 생겼어도 `git add`가 무시했다.
#   결과: 매주 돌면서 "변경 없음 — 커밋 skip"만 찍었다. 실패가 아니라 **성공으로 보였다**는 게 문제다.
#
# 키는 저장소 Settings > Secrets and variables > Actions 에 등록한다.
# 하나도 등록 안 해도 동작한다 — 키 없는 소스(관세청·BOJ·PBoC·SEC·DBnomics)만 수집된다.

name: Weekly Data Book

on:
  # ⚠ 2026-09-16 스케줄 정지 — Secrets가 비어 있어 매주 반쪽짜리를 커밋하고 있었다.
  #   09-08 167/333 · 09-15 166/339 (같은 날 수집 PC는 319/339).
  #   실패 169건이 전부 키 없음이다 — FRED 110 · ECOS 14 · 토스 10 · KOSIS 3 ·
  #   DATA_GO_KR 3 · E_STAT 3. 그런데도 워크플로는 성공으로 끝나고 커밋까지 했다.
  #   더 나쁜 건 그 커밋이 `DataBook 지표 소환.md` 의 「최신」 링크를 그 반쪽 노트로
  #   덮어쓴다는 것 — 저장소를 볼트로 여는 팀원에게는 그게 최신으로 보인다.
  #   (2026-09-01 「168/333 사고 산출물」과 같은 사고다. 원인이 여기였다.)
  #
  #   되살리는 조건 둘:
  #     (1) Settings > Secrets and variables > Actions 에 키 등록
  #     (2) 아래 「수집률 게이트」를 수동 실행으로 한 번 통과시킬 것
  #   그 다음 이 cron 주석을 풀면 된다. 화요일 17:00 KST = 화요일 08:00 UTC —
  #   학회가 화요일 저녁에 주간 통합분석을 하므로 그 직전에 수집을 끝낸다.
  # schedule:
  #   - cron: "0 8 * * 2"
  workflow_dispatch: {}   # 당분간 Actions 탭 수동 실행만

permissions:
  contents: write   # 생성물 커밋용

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: intel 지표 — vault_note 다리를 놓는다 (키 불필요)
        # `source: vault_note` 지표 6건은 디스크의 `11_AutoIndicators/` 노트를 읽는다.
        # 그 폴더는 저장소에 없고 intel.py 가 만든다 — 그래서 CI에서는 **항상** 실패했다
        # (09-08·09-15 스냅샷에 "vault_note: 11_AutoIndicators 폴더를 못 찾음" 6건).
        # 다음 단계보다 **먼저** 돌아야 한다. 순서가 뒤바뀌면 조용히 옛 값이 실린다.
        #
        # `--only indicators` 로 좁힌다 — RSS 리딩·촉매 수집은 DataKit 과 무관하고 느리다.
        # 이 6건이 쓰는 16계열(portwatch 7 · World Bank 5 · CFTC 2 · ECB/BIS 2)은
        # **전부 키가 필요 없다.** Secrets 가 비어 있어도 이 다리는 놓인다.
        # 실측 2026-09-16, 키 없는 체크아웃: 16/16 성공 → `run --only vault_note` 6/6 성공.
        #
        # 키가 필요한 나머지(EIA 3 · FRED 2)는 여기서 실패해도 무방하다 — DataKit 의
        # 다른 경로로 들어온다. 그래서 continue-on-error 다. 외부 소스 하나가 흔들려도
        # Data Book 전체를 막지 않는다. 빠지면 수집률 게이트가 잡는다.
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OBSIDIAN_VAULT_PATH: ${{ github.workspace }}
        run: python -m databook intel --only indicators

      - name: Data Book + 뉴스 생성
        env:
          # 없는 키는 빈 값으로 들어가고 해당 지표만 "수집 실패"로 표시된다
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DATA_GO_KR_LENDBORR_KEY: ${{ secrets.DATA_GO_KR_LENDBORR_KEY }}
          E_STAT_APP_ID: ${{ secrets.E_STAT_APP_ID }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # ⚠ 토스는 등록하지 않는다 — 개인 계좌 자격증명이고, 토큰이 동시 1개만 유효해
          #    로컬 실행과 부딪히면 서로 401이 된다.
          # 저장소 루트를 볼트로 삼는다 → 04_DataBook/ 이 저장소 루트에 생성된다
          OBSIDIAN_VAULT_PATH: ${{ github.workspace }}
        run: |
          # `run`이 끝에 뉴스 다이제스트까지 만든다(--no-news로 끌 수 있다).
          # 예전엔 `python -m databook.news`를 따로 한 줄 더 돌렸는데,
          # 그러면 5,400여 건을 두 번 긁어 시간만 두 배로 든다.
          python -m databook run --no-setup

      - name: 수집률 게이트 — 반쪽짜리는 커밋하지 않는다
        # 조용한 부분실패를 막는 자리다. 키가 없으면 수집은 "성공"으로 끝나면서
        # 절반이 빈 Data Book을 만든다. 그 상태로 커밋하면 지표 소환 노트가 오염되고,
        # 팀원은 그게 최신인 줄 안다. 그래서 커밋 **앞에서** 끊는다.
        #
        # 기준 80% — 수집 PC 실측이 319/339(94%)이고, CI는 토스 10건을 원래 안 받으므로
        # 키가 정상이면 91% 안팎이 나온다. 49%(키 없음)와 충분히 갈린다.
        run: |
          python - <<'PY'
          import json, pathlib, sys

          snaps = sorted(pathlib.Path("04_DataBook/snapshots").glob("snapshot_*.json"))
          if not snaps:
              print("::error::스냅샷이 없다 — 수집 단계가 아무것도 만들지 않았다")
              sys.exit(1)

          latest = snaps[-1]
          ind = json.loads(latest.read_text(encoding="utf-8"))["indicators"]
          ok = sum(1 for v in ind if v.get("observations"))
          pct = ok / len(ind) * 100
          print(f"{latest.name}: 관측치 있는 지표 {ok}/{len(ind)} ({pct:.1f}%)")

          if pct < 80:
              from collections import Counter
              top = Counter(
                  (v.get("error") or "사유 없음").split("(")[0].strip()[:60]
                  for v in ind if not v.get("observations")
              ).most_common(5)
              print("::error::수집률 " + f"{pct:.1f}% < 80% — 커밋하지 않는다.")
              for reason, n in top:
                  print(f"::error::  {n:>3}건  {reason}")
              print("::error::키가 비어 있으면 Settings > Secrets and variables > Actions 에 등록할 것")
              sys.exit(1)
          PY

      - name: 결과 커밋
        run: |
          git config user.name "databook-bot"
          git config user.email "actions@users.noreply.github.com"
          # ★ 볼트 출력 경로는 04_DataBook/ 이다 (Macro/ 아님).
          #   `11_AutoIndicators/` 는 일부러 커밋하지 않는다 — DataKit 으로 이미 실리고,
          #   매 런이 새 체크아웃이라 intel_state.json 이 없어 판정이 늘 `unset` 으로 나온다.
          #   output/ 은 .gitignore 대상이라 커밋하지 않는다 — 볼트 사본만 올린다.
          git add 04_DataBook/
          if git diff --cached --quiet; then
            echo "::warning::커밋할 변경이 없다. 04_DataBook/ 이 생성됐는지 확인할 것"
          else
            git commit -m "Data Book $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 생성 결과 확인
        # 조용한 실패를 막는다 — 파일이 안 생겼으면 워크플로를 실패시킨다
        run: |
          if [ ! -d 04_DataBook ]; then
            echo "::error::04_DataBook/ 이 생성되지 않았다. OBSIDIAN_VAULT_PATH 설정을 확인할 것"
            exit 1
          fi
          echo "생성된 파일 수: $(find 04_DataBook -name '*.md' | wc -l)"
