# =============================================================================
# 정보 소스 레지스트리 — **검색엔진을 치지 않는다.** API · 공개 CSV · RSS만.
#
# 소스 추가 = 여기 항목 하나. `databook/intel.py`는 건드리지 않는다.
#
# handler
#   eia_v2     : EIA Open Data API v2 (EIA_API_KEY)
#   portwatch  : IMF PortWatch (ArcGIS FeatureServer, 키 불필요)
#   comtrade   : UN Comtrade preview API (키 불필요, 연간)
#   fred       : FRED API (기존 키 재사용)
#   xlsx_url   : 공개 엑셀 직링크의 한 컬럼 (World Bank Pink Sheet)
#   sdmx_json  : SDMX-JSON (BIS · ECB). accept 헤더를 소스별로 지정한다
#   socrata    : Socrata Open Data (CFTC COT). 키 불필요
#   rss        : RSS/Atom
#
# direction (지표 전용) — 값이 움직인 방향이 가설을 지지하는가
#   hypothesis / direction_if_up / direction_if_down
#   직전 값이 없으면 `unset`으로 남기고 대시보드 "판정 대기"에 띄운다.
#   ⚠ **자동 판정이 안 되는 것을 조용히 넘기지 않는다.**
#
# verified — 2026-08-24에 실호출로 확인한 값이다. 추정으로 true를 적지 않는다.
# =============================================================================

indicators:

  # ---------------------------------------------------------------- 초크포인트
  # IMF PortWatch. AIS 기반 일별 통항. 28개 초크포인트 전부 제공된다.
  # ⚠ **절대 수준을 다른 초크포인트와 비교하지 말 것.** 집계 방식 때문에
  #   호르무즈는 평상시에도 하루 평균 8.4건으로 낮게 잡힌다(2026-06~08 실측).
  #   **자기 표본 대비 변화**로만 읽는다 — 볼트의 "수준이 아니라 변화" 규칙과 같다.
  - id: hormuz_transits
    label: 호르무즈 통항
    handler: portwatch
    chokepoint: chokepoint6
    field: n_total
    unit: 척/일
    hypothesis: H-배관재편
    direction_if_down: supports
    direction_if_up: contra
    verified: true
    note: 배관재편 가설이 참이면 호르무즈 의존이 줄어야 한다.

  - id: hormuz_tanker_capacity
    label: 호르무즈 탱커 용량
    handler: portwatch
    chokepoint: chokepoint6
    field: capacity_tanker
    unit: DWT/일
    hypothesis: H-배관재편
    direction_if_down: supports
    direction_if_up: contra
    verified: true

  - id: bab_el_mandeb_transits
    label: 바브엘만데브 통항
    handler: portwatch
    chokepoint: chokepoint4
    field: n_total
    unit: 척/일
    hypothesis: H-이스라엘회랑
    direction_if_up: supports        # 홍해가 안전해져야 회랑 스토리가 산다
    direction_if_down: contra
    verified: true

  - id: korea_strait_transits
    label: 대한해협 통항
    handler: portwatch
    chokepoint: chokepoint12
    field: n_total
    unit: 척/일
    hypothesis: H-한국물류
    direction_if_down: supports
    direction_if_up: contra
    verified: true
    note: 한국 수출입 물동량의 고빈도 대리. 무역 통계보다 훨씬 빠르다.

  - id: taiwan_strait_transits
    label: 대만해협 통항
    handler: portwatch
    chokepoint: chokepoint11
    field: n_total
    unit: 척/일
    hypothesis: H-동아시아긴장
    direction_if_down: supports
    direction_if_up: contra
    verified: true

  - id: malacca_transits
    label: 말라카 통항
    handler: portwatch
    chokepoint: chokepoint5
    field: n_total
    unit: 척/일
    hypothesis: H-동아시아긴장
    direction_if_down: supports
    direction_if_up: contra
    verified: true

  - id: suez_transits
    label: 수에즈 통항
    handler: portwatch
    chokepoint: chokepoint1
    field: n_total
    unit: 척/일
    hypothesis: H-이스라엘회랑
    direction_if_up: supports
    direction_if_down: contra
    verified: true

  # ---------------------------------------------------------------- 에너지 흐름
  - id: us_crude_exports
    label: 미국 원유 수출
    handler: eia_v2
    route: petroleum/move/exp
    facets: {series: MCREXUS1}
    frequency: monthly
    unit: 천배럴/월
    hypothesis: H-배관재편
    direction_if_up: supports
    direction_if_down: contra
    verified: true

  - id: us_ng_exports
    label: 미국 천연가스 수출
    handler: eia_v2
    route: natural-gas/move/expc
    frequency: monthly
    unit: MMcf/월
    hypothesis: H-배관재편
    direction_if_up: supports
    direction_if_down: contra
    verified: true

  - id: us_crude_stocks
    label: 미국 원유재고 (SPR 제외)
    handler: eia_v2
    route: petroleum/stoc/wstk
    facets: {series: WCESTUS1}
    frequency: weekly
    unit: 천배럴
    hypothesis: null
    verified: true
    note: |
      볼트 [[원자재 재고]] 판정 규칙의 재료. 가격 급등 + 재고 감소 = 펀더멘털.
      기존 EIA 수집기와 중복되지만 이쪽은 가설 연결이 붙는다.

  # ---------------------------------------------------------------- 무역 (연간)
  # ⚠ **EIA international 데이터셋에는 중국 수입이 없다.** 실측(2026-08-24):
  #   중국은 Production만 제공되고 activityId=3(Imports)은 OECD 국가만 나온다.
  #   그래서 중국 원유 수입은 **UN Comtrade**로 받는다 — 단 **연간**이다.
  - id: china_crude_imports
    label: 중국 원유 수입 (HS 2709)
    handler: comtrade
    reporter: 156        # China
    partner: 0           # World
    cmd: "2709"          # 석유원유
    flow: M
    years: 5
    unit: USD/년
    hypothesis: H-배관재편
    direction_if_down: supports
    direction_if_up: contra
    verified: true

  - id: korea_crude_imports
    label: 한국 원유 수입 (HS 2709)
    handler: comtrade
    reporter: 410        # Korea
    partner: 0
    cmd: "2709"
    flow: M
    years: 5
    unit: USD/년
    hypothesis: H-한국물류
    direction_if_up: contra
    direction_if_down: supports
    verified: true

  # ---------------------------------------------------------------- 거시 백본
  - id: brent
    label: 브렌트
    handler: fred
    series_id: DCOILBRENTEU
    unit: USD/bbl
    hypothesis: null
    verified: true

  - id: usd_krw
    label: 원/달러
    handler: fred
    series_id: DEXKOUS
    unit: KRW
    hypothesis: null
    verified: true

  # ---------------------------------------------------------------- 원자재 가격
  # World Bank Pink Sheet — 월간, 70여 품목. 유료 단말 없이 쓸 수 있는 가격 백본이다.
  # 실측(2026-08-24): 200 / 578KB / 1960M01~2026M07 / 시트 5개
  # ⚠ **URL에 판(edition) 코드가 박혀 있다.** 2025년판은 2025M12에서 멈춘다.
  #   연초에 https://www.worldbank.org/en/research/commodity-markets 에서 링크를 갱신할 것.
  # ⚠ **월평균이다.** 일별 FRED 브렌트와 같은 날 값을 비교하지 않는다.
  #   여기서 보는 건 수준이 아니라 **월간 추세와 품목 간 상대 움직임**이다.
  - id: wb_brent
    label: 브렌트 (WB 월평균)
    handler: xlsx_url
    url: "https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx"
    sheet: "Monthly Prices"
    column: "Crude oil, Brent"
    unit: USD/bbl
    verified: true          # 2026M07 = 83.4
  - id: wb_copper
    label: 구리
    handler: xlsx_url
    url: "https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx"
    sheet: "Monthly Prices"
    column: "Copper"
    unit: USD/mt
    hypothesis: H-정련병목
    direction_if_up: supports
    direction_if_down: contra
    verified: true          # 2026M07 = 13,543
  - id: wb_iron_ore
    label: 철광석
    handler: xlsx_url
    url: "https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx"
    sheet: "Monthly Prices"
    column: "Iron ore, cfr spot"
    unit: USD/dmtu
    verified: true          # 2026M07 = 98.2
  - id: wb_lng_japan
    label: LNG 일본착
    handler: xlsx_url
    url: "https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx"
    sheet: "Monthly Prices"
    column: "Liquefied natural gas, Japan"
    unit: USD/mmbtu
    hypothesis: H-배관재편
    direction_if_up: contra
    direction_if_down: supports
    verified: true          # 2026M07 = 11.8 — 배관재편이 참이면 아시아 착가 프리미엄이 눌린다
  - id: wb_aluminum
    label: 알루미늄
    handler: xlsx_url
    url: "https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx"
    sheet: "Monthly Prices"
    column: "Aluminum"
    unit: USD/mt
    verified: true          # 2026M07 = 3,161

  # ---------------------------------------------------------------- 포지셔닝
  # CFTC COT — 주간. "가격이 어디로 가나"가 아니라 **"누가 어느 쪽에 서 있나"**를
  # 보는 유일한 공개 데이터다.
  # ⚠ **극단치는 반전 신호로 읽히지만 타이밍을 주지 않는다.** 볼트 규칙대로
  #   자기 표본 백분위로 읽고, 수준만으로 방향을 부르지 않는다.
  - id: cot_wti
    label: WTI 투기적 순포지션
    handler: socrata
    url: "https://publicreporting.cftc.gov/resource/6dca-aqww.json"
    filter_contains:
      market_and_exchange_names: "WTI-PHYSICAL"
    date_field: report_date_as_yyyy_mm_dd
    compute: "noncomm_positions_long_all - noncomm_positions_short_all"
    unit: 계약
    verified: true          # 2026-08-18 = +122,090계약

  - id: cot_copper
    label: 구리 투기적 순포지션
    handler: socrata
    url: "https://publicreporting.cftc.gov/resource/6dca-aqww.json"
    filter_contains:
      market_and_exchange_names: "COPPER- #1"
    date_field: report_date_as_yyyy_mm_dd
    compute: "noncomm_positions_long_all - noncomm_positions_short_all"
    unit: 계약
    # ⚠ 가설 연결을 일부러 걸지 않았다. 투기적 순포지션은 **물리적 병목의 증거가 아니다** —
    #   기대의 지표지 수급의 지표가 아니다. 병목 판정에 쓰면 순환논증이 된다.
    verified: true          # 2026-08-18 = +79,748계약

  # ---------------------------------------------------------------- 실질실효환율
  # BIS REER — 원자재 수요국의 **구매력**을 보는 정석 지표. IMF보다 갱신이 빠르다.
  # ⚠ BIS는 sdmx-json accept가 없으면 200을 주지만 **XML로 준다**(실측).
  #   ECB는 정반대로 그 accept를 주면 406이다. 그래서 accept를 소스별로 적는다.
  - id: bis_reer_kr
    label: 한국 실질실효환율 (BIS)
    handler: sdmx_json
    url: "https://stats.bis.org/api/v2/data/dataflow/BIS/WS_EER/1.0/D.N.B.KR"
    params: {lastNObservations: 60}
    accept: "application/vnd.sdmx.data+json;version=1.0.0"
    unit: index
    verified: true          # 2026-08-18 = 88.82

  - id: bis_reer_cn
    label: 중국 실질실효환율 (BIS)
    handler: sdmx_json
    url: "https://stats.bis.org/api/v2/data/dataflow/BIS/WS_EER/1.0/D.N.B.CN"
    params: {lastNObservations: 60}
    accept: "application/vnd.sdmx.data+json;version=1.0.0"
    unit: index
    # ⚠ 제출본은 이걸 H-정련병목에 걸었으나 뗐다. REER은 **구매력**이지 정련능력이 아니다.
    #   원자재 수요 강도의 배경 변수로 읽고, 병목 판정에는 쓰지 않는다.
    verified: true          # 2026-08-18 = 113.3

  - id: ecb_eurusd
    label: EUR/USD (ECB)
    handler: sdmx_json
    url: "https://data-api.ecb.europa.eu/service/data/EXR/D.USD.EUR.SP00.A"
    params: {lastNObservations: 60, format: jsondata}
    unit: USD
    verified: true          # 2026-08-21 = 1.1699 (accept 미지정 = generic json)


reading:

  # ------------------------------------------------- 실호출로 확인 (2026-08-24)
  - id: eia_today
    label: EIA Today in Energy
    handler: rss
    url: "https://www.eia.gov/rss/todayinenergy.xml"
    tags: [energy, primary]
    verified: true          # 18건, 최신 2026-08-19

  - id: oilprice
    label: OilPrice
    handler: rss
    url: "https://oilprice.com/rss/main"
    tags: [energy, market]
    verified: true          # 15건, 당일

  # 2026-08-30 제거: bruegel — 피드 전체 10건이 컨퍼런스 일정("Lunch", "Coffee break")뿐이고
  # 발간물이 한 건도 오지 않는다. /rss/publications.xml · /feed · /rss · /rss/all.xml 전부 404이고
  # 홈페이지에도 <link rel=alternate> 피드가 없다 — 대체 경로 자체가 없다.
  # 유럽 거시는 아래 ecb_pub 으로 대체한다.

  - id: ecb_pub
    label: ECB 발간물
    handler: rss
    url: "https://www.ecb.europa.eu/rss/pub.html"
    tags: [europe, econ, primary]
    limit: 15
    verified: true          # 2026-08-30 실호출 15건 — 워킹페이퍼 제목 정상

  - id: oregon_group
    label: The Oregon Group
    handler: rss
    url: "https://theoregongroup.com/feed/"
    tags: [critical-minerals]
    verified: true          # 50건, 당일

  - id: everycrsreport
    label: EveryCRSReport (미 의회조사국)
    handler: rss
    url: "https://www.everycrsreport.com/rss.xml"
    tags: [policy, primary]
    verified: true          # 25건 — 원 레지스트리의 "확인 필요"에 있었으나 실제로 살아 있다

  - id: baker_institute
    label: Baker Institute
    handler: rss
    url: "https://www.bakerinstitute.org/rss.xml"
    tags: [energy, geopolitics]
    verified: true          # 10건 — 마찬가지로 살아 있다

  - id: reuters_energy
    label: Reuters 에너지 (헤드라인 전용)
    handler: rss
    url: "https://news.google.com/rss/search?q=site:reuters.com+crude+oil+OR+refinery+OR+LNG&hl=en"
    tags: [energy, wire]
    limit: 8
    headline_only: true     # ← 본문 확보 불가. write_reading 이 경고 배너를 붙인다
    verified: true
    note: |
      ⚠ **본문을 볼 수 없는 피드다. 헤드라인 신호로만 쓴다.** (2026-08-30 실측)
      ① 링크가 news.google.com/rss/articles/CBMi… 리다이렉트인데 protobuf 인코딩이라
         base64 안에 URL이 없고, 그냥 열면 빈 페이지가 온다.
      ② Google 내부 batchexecute 로 실제 URL 복원은 되지만(시험 성공) 비공개 엔드포인트라 깨지기 쉽다.
      ③ 복원해도 **reuters.com 자체가 봇 차단**이라 본문을 못 읽는다 — 복원할 실익이 없다.
      그래서 limit을 20→8로 줄였다. 호르무즈·탱커 취재는 gcaptain 으로 대체한다(본문 판독 가능).

  # 2026-08-30 신설 — Reuters가 못 주는 '읽히는' 해운·탱커 취재
  - id: gcaptain
    label: gCaptain (해운·탱커)
    handler: rss
    url: "https://gcaptain.com/feed/"
    tags: [shipping, energy, geopolitics]
    limit: 12
    verified: true          # 실호출 12건 + 본문 판독 확인(파나마운하 혼잡: 대기 14척·최대 8일·$4.6M 새치기)

  - id: hellenic_shipping
    label: Hellenic Shipping News
    handler: rss
    url: "https://www.hellenicshippingnews.com/feed/"
    tags: [shipping, freight, market]
    limit: 12
    verified: true          # 실호출 20건 — BDI·건화물·탱커 운임


  # ------------------------------------------------- 학술·중앙은행 (2026-08-24 실호출)
  - id: nber
    label: NBER Working Papers
    handler: rss
    url: "https://back.nber.org/rss/new.xml"
    tags: [academic, macro]
    limit: 20
    verified: true          # 26건
    note: |
      ⚠ **항목에 날짜 필드가 없다**(실측). 수집일로 적히므로 "언제 나온 논문인가"는
      노트에서 확인할 수 없다. 인용할 때 NBER 페이지에서 발행일을 직접 볼 것.

  - id: arxiv_qfin
    label: arXiv q-fin.TR (마이크로구조)
    handler: rss
    url: "http://export.arxiv.org/api/query?search_query=cat:q-fin.TR&sortBy=submittedDate&sortOrder=descending&max_results=15"
    tags: [academic, quant]
    verified: true          # 15건, 당일(2026-08-24)

  - id: liberty_street
    label: Liberty Street Economics (뉴욕 연준)
    handler: rss
    url: "https://libertystreeteconomics.newyorkfed.org/feed/"
    tags: [fed, macro]
    limit: 25
    verified: true          # 100건, 최신 2026-08-19
    note: |
      연준 계열 블로그 중 실증 품질이 가장 높다. GSCPI도 여기서 나온다 —
      볼트가 이미 GSCPI 수치를 받고 있으니 **해석 쪽을 여기서 보충**한다.

  # ------------------------------------------------- 죽었거나 못 찾은 것
  # **추정으로 verified: true를 적지 않는다.** 아래는 실호출 결과다(2026-08-24).
  #
  # csis            RSS는 살아 있으나 **최신 항목이 2016-03**이다. 사실상 죽었다.
  #                 → 볼트는 이미 CSIS를 HTML 스크랩으로 받고 있다(research_feed)
  # carnegie        200을 주지만 item 0. 실제 피드 주소를 못 찾았다
  # kse_institute   kse.ua/feed/ → 200이지만 item 0
  # iea_news        iea.org/rss/news → 404
  # mofcom          중국 상무부 → 404 (이전 조사에서 해관도 412 차단)
  # usgs            usgs.gov/products/data/all-data/rss → 404
  #
  # ── 2026-08-24 추가 실측 ──
  # voxeu/cepr      cepr.org/rss.xml → **200이지만 기사 피드가 아니다.** 항목 10건이
  #                 전부 주제 분류명("Public Policy", "Human Resources")이고
  #                 최신 pubDate가 **2024-04-18**이다. columns/vox/all/feed 등
  #                 8개 후보 전부 404·403. **살아 있는 VoxEU 피드를 찾지 못했다.**
  #                 ⚠ CSIS와 같은 실패 유형이다 — **HTTP 200은 살아 있다는 뜻이 아니다.**
  #                 최신 항목 날짜를 보지 않으면 죽은 피드를 매일 성공으로 센다.
  # opec_momr       opec.org 월간 원유시장 보고서 → **403**(기본·브라우저UA·신규경로 전부).
  #                 제출 레지스트리에는 200으로 적혀 있었으나 이 회선에서는 안 열린다.
