  - name: 중국 실물 (소매판매·서비스생산·고정자산투자·부동산투자)
    method: api
    source: nbs
    report: activity
    tier: 2
    note: '2026-08-26 신설 — NBS 월간(DBnomics 미러). **부동산개발투자를 같은 줄에 두는 게 요점**이다: 실측 2026-02 소매 **+2.8%** · 서비스생산 **+5.0%**(2025-12) · 고정자산투자 **+1.8%** · 부동산개발투자 **−11.1%** — 총투자가 겨우 플러스인 건 부동산의 두 자릿수 감소를 제조업 투자가 메우고 있기 때문이다. **"중국 투자가 살아났다"를 총계로 말하지 말 것.** ⚠ 누계(연초누계) 증가율이라 월별 모멘텀이 아니다 — 월 단위 변화를 보려면 누계에서 역산해야 한다. ⚠⚠ **NBS 미러는 2026-08-26 기준 2026-02까지다(약 6개월 지연).** NBS 공식 API(data.stats.gov.cn)는 WAF 403으로 막혀 우회 경로가 없다. **속보 판단에 쓰지 말고 구조·추세 확인용으로만** 쓸 것 — 중국에서 당월에 가까운 자동 계열은 관세청(GACC) 무역통계뿐이다. **⚠ 2026-08-28 원문 확인 — 미러(2026-02)와 부호가 갈린다.** NBS 中文 발표(2026-08-17) 기준 1—7월 누계: **고정자산투자 −6.7%**(미러 2026-02는 +1.8%) · 그중 民间투자 **−9.4%** · 국유지주 −3.3%, **부동산개발투자 −19.2%**(43,009억위안, 미러 −11.1%에서 더 악화), 소매판매 **+1.2%**(미러 +2.8%에서 둔화), 7월 규모이상 공업증가치 **+4.5%**. **읽는 법: 총투자 −6.7%인데 民间 −9.4% — 민간이 더 깊다.** 설비(设备工器具购置 +9.0%)만 플러스고 건축설치(建筑安装工程 −9.2%)가 끌어내린다. 원문: https://www.stats.gov.cn/sj/zxfb/ ⚠⚠ **2026-08-30 수집 경로 교체** — 미러가 2026-02에서 멈춰 NBS 발표문을 직접 읽는다(source=nbs). 소매판매·공업증가치·고정자산투자·부동산개발투자·서비스업생산·도시조사실업률을 한 번에 받는다. 고정자산·부동산은 **연초 누계 전년비**다.'
