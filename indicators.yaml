    companies:
      - {ticker: MSFT,  cik: 789019}
      - {ticker: AMZN,  cik: 1018724}
      - {ticker: GOOGL, cik: 1652044}
      - {ticker: META,  cik: 1326801}
      - {ticker: ORCL,  cik: 1341439}
      - {ticker: CRWV,  cik: 1769628}
    metrics: [capex, fcf]
    points: 3
    note: '2026-08-27 신설. **볼트 신용 블록은 전부 시장이 매긴 가격(HY/IG OAS·EBP·GZ)인데, 지금 미국 신용사이클의 중심인 AI 자본지출은 가격이 아니라 재무제표에 있다.** 스프레드가 벌어지기 전에 대차대조표가 먼저 움직인다. **판정 규칙: 「영업현금흐름 − 자본지출」의 부호와 추세.** 벌어서 짓는가, 빌려서 짓는가를 가른다. 실측(최근 회계연도, 전년 대비): capex는 전부 1년 만에 거의 2배 — MSFT 64.6→**115.9B** · AMZN 83.0→**131.8B** · GOOGL 52.5→**91.4B** · META 37.3→**69.7B** · ORCL 21.2→**55.7B** · CRWV 8.7→**10.3B**. 그런데 자체조달 여력은 갈린다: MSFT +67.0 · GOOGL +73.3 · META +46.1로 여유가 있고, **AMZN은 32.9→+7.7로 급감**, **ORCL −0.4→−23.7**, **CRWV −6.0→−7.3**으로 마이너스다. 즉 AI 캐펙스의 신용 리스크는 하이퍼스케일러 전체가 아니라 **오라클·코어위브에 집중**돼 있다. **3개년으로 보면 더 분명하다 — ORCL 자본지출 6.9 → 21.2 → 55.7B(2년 8배), 자체조달 여력 +11.8 → −0.4 → −23.7B로 부호가 뒤집혔다.** 같은 기간 MSFT는 44.5 → 64.6 → 115.9B로 늘렸는데 여력은 74.1 → 71.6 → 67.0으로 완만히 줄었을 뿐이다. ⚠ **연간(10-K) 값만 쓴다** — 10-Q 현금흐름표는 연초누계라 분기값을 그냥 쓰면 최대 3배 부풀려진다. ⚠ 회계연도 종료월이 다르다(MSFT 6월·ORCL 5월·나머지 12월) — 같은 줄에 있어도 기준일이 다르니 기준일을 함께 읽을 것. ⚠ NVDA는 뺐다: 자본지출 6.0B로 **파는 쪽**이라 이 판정의 대상이 아니다'
