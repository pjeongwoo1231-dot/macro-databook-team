  - name: 위험충격 종류 분류 (VIX·실질금리·엔 3축)
    tier: 1
    method: derived
    formula: VIXCLS·DFII10·DEXJPUS 5영업일 변화로 국면 라벨링 (셋 다 이미 수집 중)
    vault_node: VIX
    note: '2026-08-15 신설. **판정 규칙이지 예측 지표가 아니다.** 제텔 소환 인덱스 §1 — "VIX로 위험을 단일 대리하지 말 것, 충격 종류를 먼저 분류할 것"을 자동화했다. 임계는 2006~2026 전 표본 5,108일 5영업일 변화의 **p90**(VIX +3.5pt · 실질금리 +13bp)에서 뽑았다. 채점 결과(같은 표본): 리스크오프 436일 → 엔 절상 70%·원 절하 73% / 미 금리 주도 463일 → 엔 절상 19%뿐(둘 다 절하) / **평시 4,135일 → 47%·46% = 정보 없음**. 근거 제텔 = 엔의 안전통화 기능은 리스크오프에서만 켜진다 · 한국은 이중타격, 일본은 자연헤지 · 채점 결과 — 엔 절상·원 절하 비대칭은 12년 뒤에도 유효하나 3분의 1로 약해졌다. ⚠ 라벨이 "평시"면 환율 움직임을 매크로 충격으로 설명하지 말 것 — 국내 수급 요인을 먼저 본다. ⚠ DEXJPUS는 VIX보다 공표가 며칠 늦어 기준일이 어긋날 수 있다(각 관측일을 함께 출력한다)'
