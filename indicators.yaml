  - name: 일본 CPI (코어·코어코어, 월간)
    vault_node: CPI (소비자물가지수)
    tier: 1
    method: api
    source: dbnomics
    yoy: true
    db_series: ["STATJP/CPIm/733", "STATJP/CPIm/740", "STATJP/CPIm/001"]
    db_labels: ["코어(신선식품 제외)", "코어코어(신선식품·에너지 제외)", "종합"]
    note: '확인 완료(2026-08-26) — **World Bank 연간(1년에 1점) → 총무성 통계국 월간으로 교체**. DBnomics가 미러하는 STATJP 계열이라 키가 필요 없다. 실측 2026-07 코어 **+1.79%** · 코어코어 **+1.90%**. ⚠ **원본이 지수 레벨이라 전년비는 이쪽에서 계산한 값**이다 — 총무성 공표 전년비와 반올림에서 0.1%p 갈릴 수 있으니 인용 전 원문 대조. ⚠ BOJ가 보는 건 코어(신선식품 제외)지만, 2022~23 수입물가 충격의 잔향을 걷어내려면 **코어코어를 함께** 봐야 한다 — 두 계열의 격차가 판정 재료다. ⚠ e-Stat 직접 연결은 appId 발급 후 전환 예정(DBnomics는 갱신이 며칠 늦을 수 있다)'
  - name: 일본 PPI·수출입물가 (전년비)
    tier: 2
    method: api
    source: boj_api
    db: PR01
    codes: ["PRCG20_2200000000%", "PRCG20_2600000000%", "PRCG20_2400000000%"]
    labels: ["국내기업물가 PPI", "수입물가(엔베이스)", "수출물가(엔베이스)"]
    freq: M
    points: 6
    note: '2026-08-26 신설 — BOJ 공식 API(PR01), 공표 전년비 원본. 실측 2026-07 PPI **+7.2%** · 수입물가 엔베이스 **+29.1%**. 환율 전가분을 보려면 **바로 아래 계약통화베이스 지표와 격차로** 읽는다. ⚠ 계열 코드에 `%`가 들어간다(공표 전년비 원본) — URL 인코딩 필수, fetcher가 처리한다. 근거 렌즈 = 한국 인플레이션 동학은 CPI가 아니라 PPI로 봐야 정합적이다 · BOJ WP 23-E-13(PS-NKPC, 투입가격 전가는 불완전할 뿐 사라지지 않는다)'
  - name: 일본 수출입물가 계약통화베이스 (전년비)
    tier: 2
    method: api
    source: boj_api
    db: PR01
    codes: ["PRCG20_2500000000", "PRCG20_2300000000"]
    labels: ["수입물가(계약통화베이스)", "수출물가(계약통화베이스)"]
    freq: M
    points: 6
    yoy: true
    note: '2026-08-26 신설 — **위 엔베이스 지표와 짝으로만 의미가 있다**: 엔베이스 − 계약통화베이스 = **환율 전가분**이라, "일본 수입물가가 오른다"가 국제 원자재 때문인지 엔 약세 때문인지 갈린다. ⚠ **BOJ는 계약통화베이스 전년비를 공표하지 않는다**(레벨 계열만 존재) — 여기 값은 레벨에서 계산한 것이다. 처음 4개 코드를 한 지표에 묶었다가 존재하지 않는 `..2500000000%` 때문에 400을 받았고, 그래서 지표를 둘로 갈랐다'
  - name: 일본 서비스물가 SPPI (전년비)
    tier: 2
    method: api
    source: boj_api
    db: PR02
    codes: ["PRCS20_5200000000%"]
    labels: ["기업향 서비스가격 SPPI"]
    freq: M
    points: 6
    note: '2026-08-26 신설 — BOJ 공식 API(PR02, 기업향서비스가격지수). **재화 물가(PPI)가 꺾여도 서비스 물가가 안 꺾이면 그게 임금발 인플레**다. 일본에서 2% 정착 여부를 가르는 계열이라 PPI와 짝으로 본다. 실측 2026-07 **+3.6%**'
  - name: 일본 기업 물가전망 (단칸, 1·3·5년 후)
    tier: 1
    method: api
    source: boj_api
    db: CO
    codes: ["TK99F0000204HCQ01000", "TK99F0000205HCQ01000", "TK99F0000206HCQ01000"]
    labels: ["1년 후(%)", "3년 후(%)", "5년 후(%)"]
    freq: Q
    points: 5
    note: '2026-08-26 신설 — 단칸 「기업의 물가 전망」 대기업 전산업 평균(2014Q1~). **기대인플레이션을 가계 설문이 아니라 가격을 매기는 주체에게 물은 값**이라 앵커링 판정에 직접 쓴다. 실측 2026Q2 1년 후 **2.3%**. ⚠ 분기 계열이라 반응이 느리다 — 주간 트리거로 쓰지 말고 **레짐 배경 조건**으로 쓴다. ⚠ 대조 렌즈: 한국 기대인플레이션은 후향적이고 금리 인상으로 낮아지지 않았다 — 일본은 후향성이 더 강한 표본이라 "전망이 올라간다 = 앵커가 풀린다"로 바로 읽지 말 것'
  - name: 영국 CPI
    unit: "%"
    tier: 2
    method: api
    source: dbnomics
    db_series: OECD/DSD_PRICES@DF_PRICES_ALL/GBR.M.N.CPI.PA._T.N.GY
    db_labels: ["영국 CPI YoY(%)"]
    max_age_days: 150   # OECD 물가 데이터셋은 3~4개월 지연이 정상 — 기본 임계로는 상시 오탐
    note: 확인 완료(2026-08-26, 최신 2026-04 3.0%) — FRED GBRCPIALLMINMEI는 OECD MEI 폐지로
      2025-03에서 정지(1년 5개월). OECD 신규 물가 데이터셋(DSD_PRICES) 원천으로 교체.
      이미 전년비(%) 형태라 지수 변환이 필요 없다
  - name: 중국 CPI
    method: api
    source: nbs
    report: cpi
    unit: "%"
    vault_node: CPI (소비자물가지수)
    tier: 2
    report: cpi
    max_age_days: 150   # 같은 OECD 데이터셋 — 지연이 구조적이다
    note: 확인 완료(2026-08-26, 최신 2026-05 1.2%) — 3단계로 옮겨왔다.
      FRED CHNCPIALLMINMEI(2025-04 정지) → NBS 미러(2026-02, 6개월 지연) → OECD DSD_PRICES(2026-05).
      NBS 미러는 CPI뿐 아니라 PMI(2026-02)·소매판매(2025-12)·산업생산(2025-12)까지 계열 전반이
      무너져 있어 쓰지 않는다. NBS 공식 API는 WAF 403으로 우회 불가.
      ⚠ 이 계열은 전년비(%) 직접 제공 — 이전 NBS 계열처럼 100을 빼면 안 된다.
      ⚠ 여전히 3개월 지연이므로 속보 판단용이 아니다. 중국 당월 신호는 관세청(GACC) 무역통계와
      한국 대중 수출로 볼 것.
      ⚠⚠ 2026-08-30 다시 교체 — OECD(3개월 지연) 대신 NBS 발표문 직독(source=nbs).
      2026-07분을 당월에 받는다. 消费品/服务 분해가 함께 들어와 지속성을 서비스로 판정할 수 있다.
      ⚠⚠ 2026-08-30 또 교체 — OECD(3개월 지연) 대신 NBS 발표문 직독(source=nbs).
      2026-07분을 당월에 받는다. 消费品/服务 분해가 함께 들어와 지속성을 서비스로 판정할 수 있다.
  - name: 중국 PPI (전체·생산자재·소비재)
    method: api
    source: nbs
    report: ppi
    tier: 1
    report: ppi
    note: '2026-08-26 신설 — **볼트 규칙 「중국의 디플레 수출은 소비재 PPI로 판정한다」를 자동화한 자리.** 전체 PPI만 보면 원자재 가격 변동에 끌려다녀 수출 디플레 압력이 가려진다. 실측 2026-02 전체 **99.1** · 생산자재 **99.3** · 소비재 **98.4**(전년동월=100 → 각각 −0.9% / −0.7% / −1.6%). **소비재가 가장 깊게 마이너스** = 대외로 나가는 가격 압력이 아직 살아 있다. ⚠ 지수라 100을 빼야 전년비(%)다. ⚠ 41개월 연속 하락은 2026-03에 종료됐다 — "몇 개월째 하락" 표현을 쓰기 전에 최신 부호를 확인할 것. ⚠⚠ **NBS 미러는 2026-08-26 기준 2026-02까지다(약 6개월 지연).** NBS 공식 API(data.stats.gov.cn)는 WAF 403으로 막혀 우회 경로가 없다. **속보 판단에 쓰지 말고 구조·추세 확인용으로만** 쓸 것 — 중국에서 당월에 가까운 자동 계열은 관세청(GACC) 무역통계뿐이다. **⚠ 2026-08-28 원문 확인 — 미러가 5개월 늦어 부호가 반대다.** NBS 中文 발표(2026-08-09, 「2026年7月份工业生产者出厂价格同比上涨3.5%」) 기준 **2026-07 PPI 전체 +3.5%** — 미러의 2026-02 −0.9%와 정반대다. 구성: **生产资料(생산재) +4.8%**(전체를 +3.72%p 끌어올림) vs **生活资料(소비재) −0.8%**(−0.17%p). **볼트 규칙대로 소비재로 판정하면 여전히 마이너스** — 전체 PPI 플러스 전환은 생산재(원자재·에너지)가 만든 것이고 **대외 디플레 압력은 아직 살아 있다.** 전체만 보면 정반대로 읽는다. 원문: https://www.stats.gov.cn/sj/zxfb/ ⚠⚠ **2026-08-30 수집 경로 교체 — 미러를 버리고 원문을 직접 읽는다.** www.stats.gov.cn/sj/zxfb 발표문에서 生产资料·生活资料·采掘·原材料·加工·食品·购进을 함께 파싱한다(source=nbs). data.stats.gov.cn API는 여전히 403이다. ⚠⚠ **2026-08-30 수집 경로 교체** — 미러(2026-02 정지)를 버리고 NBS 발표문 직독(source=nbs). 生产资料·生活资料·采掘·原材料·加工·食品·购进을 함께 파싱한다. data.stats.gov.cn API는 여전히 403이다.'
