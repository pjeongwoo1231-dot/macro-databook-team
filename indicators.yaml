    months: 4
    note: '**2026-08-26 뉴스 헤드라인 → 실계열로 교체.** 2026-07-19에 "자동화 불가"로 확정했던 항목인데, **색인 페이지를 잘못 본 판정이었다** — `.../116219/116319/`(통계데이터)는 JS 렌더라 링크가 안 잡히지만 `.../116219/116225/`(데이터해석)는 서버 렌더라 월보 링크가 그대로 있다. 실측 2026-07 **TSF 존량 463.27조위안(+7.4%)** · TSF 연초누계 증량 **22.25조위안**(전년 동기 대비 −1.74조) · M2 **+7.7%** · M1 **+4.0%** · 실체경제 위안화대출 **+5.2%** · **정부채권 잔액 +14.1%**. **읽는 법: 중국 신용 증가는 지금 재정(정부채권 +14.1%)이 끌고 민간 대출(+5.2%)은 처져 있다** — TSF 총계만 보면 이 구성이 안 보인다. M1(+4.0%)이 M2(+7.7%)에 한참 못 미치는 것도 같은 이야기(돈이 예금에 묶여 거래로 안 돈다). ⚠ 3·6·9·12월분은 제목이 「一季度」·「上半年」·「三季度」·연간으로 바뀐다 — fetcher가 기간을 환산한다. ⚠ 표가 아니라 **산문에서 숫자를 뽑는다**. PBoC가 문구를 바꾸면 조용히 실패하니, 값이 안 나오면 원문 문구부터 확인할 것. ⚠ NBS 미러의 중국 M2(2026-02, +9.0%)와 **기준월도 값도 다르다** — 인용할 때 어느 쪽인지 밝힐 것. 이쪽이 원출처이고 최신이다'
