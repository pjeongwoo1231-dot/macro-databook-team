    method: manual
    note: '**2026-08-28 원문 확인해 채움.** 자동 경로는 없다 — 毎月勤労統計은 e-Stat 갱신이 2021-10에 멈췄고(統計コード 00450071, 552개 표 전수 확인) 춘투는 애초에 統計가 아니라 連合 집계다. 그래서 사람/에이전트가 원문에서 옮긴다. **[毎月勤労統計 2026년 6월분 속보 — 2026-08-05 공표, 사업소규모 5인 이상, 조사산업계]** 현금급여총액 **531,677엔 · 명목 +3.4% · 실질 +1.6%** · 소정내급여 279,189엔 +3.4% · 소정외급여 20,043엔 +2.8%. **실질임금은 2026-01에 플러스 전환**해 6개월 연속 플러스다(01 +0.7 · 02 +2.0 · 03 +1.4 · 04 +2.0 · 05 +1.6 · 06 +1.6). 2022~2025년은 연간 실질이 내내 마이너스였다(−1.0 · −2.5 · −0.3 · −1.3). **[連合 2026 춘계생활투쟁 제7회(최종) — 2026-07-01 집계, 07-03 공표]** 평균임금방식 5,368조합 가중평균 **16,400엔 · 5.01%**(전년 동시기 대비 +44엔 · −0.24%p) — **3년 연속 5%대**. 300인 미만 중소 3,831조합은 12,866엔 · **4.69%**(+505엔 · +0.04%p)로 중소가 오히려 개선. 임금인상분만 따로 보면 3,732조합 11,510엔 · **3.50%**(−0.20%p). **읽는 법: 이 지표는 단독으로 쓰지 말고 자동 수집 중인 SPPI(서비스물가)와 대조한다.** BOJ 정상화의 전제가 "임금 상승이 서비스 물가로 전가되는가"이고, 2026-07 SPPI +3.6% vs 소정내급여 +3.4%로 **거의 같은 속도**다 — 전가가 실제로 일어나고 있다는 뜻. ⚠ 毎月勤労統計은 2018년 부정통계 사건 이후 표본 교체 때마다 단절이 있어 전년비를 길게 이어 볼 때 주의. ⚠ 춘투는 連合 가맹 조합 집계라 전체 노동자를 대표하지 않는다(비조합·중소 미가맹 제외). ⚠ 6월은 상여 지급월이라 현금급여총액 지수가 튄다(167.0) — 수준이 아니라 전년비로 읽을 것. 다음 갱신: 毎月勤労統計 7월분(9월 초 공표) https://www.mhlw.go.jp/toukei/list/30-1a.html · 連合 https://www.jtuc-rengo.or.jp/activity/roudou/shuntou/'
