    note: '확인 완료(2026-07-18) · **2026-08-26 M1 추가**. **M1과 M2를 같이 봐야 한다**: M2−M1 격차가 벌어지면 돈이 예금에 묶여 실물로 안 도는 것(중국식 유동성 함정 신호)이고, M1이 M2를 따라 붙으면 기업 거래성 자금이 살아나는 것이다. 실측 2026-02 M2 **+9.0%** · M1 **+5.9%** → 격차 3.1%p. 3팀 중국 신용임펄스와 함께 해석. ⚠⚠ **NBS 미러는 2026-08-26 기준 2026-02까지다(약 6개월 지연).** NBS 공식 API(data.stats.gov.cn)는 WAF 403으로 막혀 우회 경로가 없다. **속보 판단에 쓰지 말고 구조·추세 확인용으로만** 쓸 것 — 중국에서 당월에 가까운 자동 계열은 관세청(GACC) 무역통계뿐이다.'
