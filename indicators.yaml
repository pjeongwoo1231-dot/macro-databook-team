    note: '2026-08-19 신설. **1차 점검에서 "토스에 국채는 없다"고 적었던 것을 정정한다** — 심볼 이름(KTB·GOVT3Y)을 잘못 짚었을 뿐, `KR_BOND_{2Y,3Y,5Y,10Y,20Y,30Y}` 6개 만기가 실재한다. 왜 필요한가 — 바로 위 ECOS 817Y002는 **하루 늦다.** 8/27 금통위처럼 날짜가 박힌 판정에서 그 하루가 곧 오판이다. 이건 장중 값이고 **커브 전 구간(2~30Y)을 한 번에** 준다. ⚠ **볼트의 커브 규칙(P3)은 국고3Y − CD91인데 토스는 CD91을 주지 않는다.** 즉 이 지표는 3Y 다리만 앞당기는 **부분 교차검증**이지 P3 판정 입력의 대체가 아니다 — CD91은 계속 ECOS에서 온다. **ECOS와 실측 대조(2026-08-11~18, 5영업일)**: 3Y·10Y 모두 차이 **0.0~0.8bp**로 사실상 같은 값이다(중앙값 +0.1bp). 즉 장중 값을 전일 확정치처럼 써도 수준 오차는 무시할 만하다. ⚠ 그래도 **공식 인용·장기 시계열은 ECOS 기준**을 쓴다 — 토스는 이력이 2020년까지뿐이고 민평 기준·시각이 다르다. 어긋나는 날이 나오면 어느 쪽이 맞다고 단정하지 말고 둘 다 기록할 것. ⚠ 현재가 응답의 timestamp가 국채에서는 null이라 **기준일이 "-"로 남는다**(일봉 종가 쪽은 날짜가 있다)'
