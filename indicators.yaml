    note: >-
      2026-08-21 신설. [[설비가동률]] 노드가 status proposed · **Data Book 미수집** 상태였다.
      ✅ 2026-08-31 갱신 — **근거 공백이 메워졌다.** Bastianin, Rossini & Tonni(2025, FEEM WP 34.2025)가
      실시간 정보집합에서 **1차금속 부문 신규수주·설비가동률**을 금속가격 중기 예측의 지배적 예측변수로 지목했다.
      단 그 논문의 근거는 **총지수(TCU)가 아니라 부문 가동률**이다 → 아래 `설비가동률 (1차금속 부문)` 참조.
      Hall & Jorgenson(1967) 명제대로 **사용자비용과 함께** 본다.
  - name: 설비가동률 (1차금속 부문)
