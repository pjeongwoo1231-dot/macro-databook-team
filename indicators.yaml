  - name: 남캅카스·중간회랑 논평 (GEOpolitics, 조지아)
    vault_node: 지정학적 리스크
    tier: 2
    method: scrape
    source: research_feed
    feeds: [politicsgeo]
    points: 8
    note: '2026-08-19 신설. politicsgeo.com — 조지아 발간 지정학 계간지. **왜 이 매체인가**: 볼트에 `지정학 — 중앙아시아·코카서스(카자흐 원유·우라늄, 중간회랑)` 축이 이미 있는데 계열이 **구글 뉴스 헤드라인뿐**이었다. 중간회랑(Middle Corridor)·남오세티야·아르메니아-아제르바이잔은 **현지 매체가 먼저 쓰고 서방 매체가 늦게 받는다** — 그 시차를 메운다. 첫 실행에서 남오세티야 병합 위험, 트빌리시-예레반 축 이동, 러시아 하이브리드전이 들어왔다. ⚠ **RSS는 죽어 있다** — `/feed/`가 200을 주지만 item이 0건이다(기사가 커스텀 포스트 타입이라 기본 피드에 안 실린다). 그래서 **`post-sitemap.xml`을 목록으로 쓴다**(2026-08-19 실측 기사 221건·이슈 32호). 사이트맵은 `<loc>`과 `<lastmod>`만 주므로 **제목은 URL 슬러그에서 복원**한 것이다 — 원제와 대소문자·구두점이 다르다. ⚠ **당사국 매체다.** 조지아 국내 정치(조지아드림 정부 비판)가 논조에 섞인다 — 러시아·EU 관련 서술은 **반대 증거를 같이 찾는다**(등급은 출처가 아니라 근거로). ⚠ 갱신은 월 단위다. 급변 감지는 뉴스 피드·GPR이 맡는다'
  - name: 지정학 논평 피드 (The Geopolitics)
    vault_node: 지정학적 리스크
    tier: 2
    method: scrape
    source: research_feed
    feeds: [geopolitics]
    points: 6
    note: '2026-08-19 신설. thegeopolitics.com RSS(10건 보관). 기존 지정학 계열은 **뉴스 헤드라인(구글/네이버)과 GPR 지수**뿐이라 "무슨 일이 났나"는 알아도 **"어떻게 읽히고 있나"는 못 봤다.** 이 피드가 그 공백을 메운다 — 인도·중국, QUAD, 캐나다 잠수함 결정과 한국 방산수출처럼 **볼트의 지정학 노출 계열과 직접 겹치는 주제**가 들어온다. ⚠ **기관 리서치가 아니라 기고 논평 매체다.** 저자가 매번 다르고 동료심사가 없다 — 등급은 `commentary`로 받고 **판정 근거로 승격하지 않는다**(등급은 출처가 아니라 근거로). ⚠ **갱신이 느리다** — 점검 시점(2026-08-19) 최신 항목이 2026-07-27로 약 3주 전이다. 이걸 실시간 지정학 감시로 쓰면 안 된다. 급변 감지는 계속 뉴스 피드·GPR이 맡는다. ⚠ 제목·날짜·링크만 온다. 본문 판독 없이 인용하지 않는다'
  - name: 미 관세 수입 (재무부 MTS, 월별)
    vault_node: 무역분쟁·관세
    tier: 1
    method: api
    source: fiscaldata
    endpoint: /v1/accounting/mts/mts_table_9
    items: [Customs Duties]
    since: "2024-10-01"
    points: 18
    note: >-
      2026-08-21 신설. **[[무역분쟁·관세]] 노드가 "볼트에 계열이 없다 → 수집기 후보"라고 적어둔 바로 그 계열이다.**
      관세는 그동안 계열이 아니라 뉴스 사건으로만 처리돼 왔는데, 재무부 MTS 표9가 **실제 징수액**을 월별로 준다(키 불필요·무료).
      ⚠ **부호 규약이 함정이다.** 필드가 rcpt_outly(수입/지출 겸용)라 **환급이 크면 당월이 음수**가 된다 —
      실측(2026-08-21)에서 2026-06 **−256억달러** · 2026-07 **−85억달러**였고,
      **회계연도 누계도 1,886억 → 1,545억으로 감소**했다. 즉 **대규모 환급이 진행 중**이라는 신호다.
      **당월값만 보고 "관세가 줄었다"고 쓰지 말 것** — 누계·전년 동기와 함께 읽는다.
      ⚠ 이 계열은 **징수액이지 관세율이 아니다.** 수입물량이 줄어도 같이 준다 — 관세율 변화는 뉴스 계열과 대조해야 한다.
