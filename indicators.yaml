  - name: 중국 무역 총액 (해관총서 속보)
    tier: 2
    method: api
    source: gacc
    report: totals
    currency: USD
    months: 3
    note: '2026-08-26 신설 — 중국 해관총서(GACC) 영문 속보. **중국 파트에서 유일하게 당월에 가까운 자동 계열**이다(NBS 미러는 6개월 지연, NBS 공식 API는 WAF 403). 실측 2026-07 수출 **3,978.5억달러(+23.9%)** · 수입 **2,853.5억달러(+27.5%)** · 무역흑자 **1,125.0억달러**. ⚠ 속보라 이후 개정된다. ⚠ 위안화 표시(CNY)와 달러 표시(USD)의 증가율이 환율 때문에 갈린다 — 여기서는 USD 기준이다'
  - name: 중국 원자재 수입 (원유·철광석·구리·석탄·가스 — 물량과 금액)
    tier: 1
    method: api
    source: gacc
    report: imports
    currency: USD
    items: ["Crude petroleum oils", "Iron ores and concentrates", "Copper ores and concentrates", "Coal and lignite", "Natural gases"]
    quantity: true
    months: 3
    note: '2026-08-26 신설 — **중국 파트에서 가장 중요한 자리.** 중국이 글로벌 원자재 수요의 본체라, 여기서 물량과 금액을 갈라 보면 원자재 가격이 수요 때문인지 공급·가격 때문인지 판정된다. 실측 2026-07 누계 **원유 물량 −13.2% / 금액 +0.9%** — 가격이 물량 감소를 정확히 상쇄했다(= 중국 실물 원유 수요는 줄고 있다). 구리광 **물량 −1.8% / 금액 +35.5%**(순수 가격), 철광석 **물량 +5.9% / 금액 +11.6%**. ⚠ 물량 단위가 품목마다 다르다(万톤·톤·万CBM) — 라벨에 표기된다. ⚠ 전년비는 **연초누계 기준**이라 당월 모멘텀이 아니다. ⚠ 품목명은 GACC 표기와 정확일치로 고른다'
  - name: 중국 국가별 무역 (미국·EU·ASEAN)
    tier: 2
    method: api
    source: gacc
    report: country
    currency: USD
    items: ["United States (US)", "European Union", "ASEAN"]
    months: 3
    note: '2026-08-26 신설 — 같은 GACC 속보의 국가별 절. **관세의 실물 효과가 여기서 갈린다**: 실측 2026-07 누계 대미 수출 **+2.6%** vs 전체 수출 **+18.5%**, 그런데 대ASEAN 수출은 **+25.1%**(대베트남 +27.5%). 대미가 눌린 만큼 ASEAN이 튀는 구조라 **우회수출(transshipment) 가설을 점검할 재료**가 된다 — 다만 이 데이터만으로 우회를 단정할 수는 없다(ASEAN 자체 수요와 구분되지 않는다). ⚠ 국가명은 GACC 표기와 정확일치 — "United States (US)"처럼 괄호까지 맞춰야 한다'
