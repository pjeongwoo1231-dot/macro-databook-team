    note: '2026-08-28 신설 — 위 연간 지표의 **속보판**. 10-K만 쓰면 갱신이 연 1회라 대부분의 기간에 낡은 값을 본다. 분기값은 **약 6개월 최신**이다(연간은 GOOGL·META·CRWV가 2025-12까지인데 분기는 2026-06까지). 실측 2026-06분기 자본지출: AMZN **54.2B** · GOOGL **44.9B** · MSFT **35.8B** · META **30.1B** · ORCL 16.5B(2026-05) · CRWV 6.4B. 분기 자체조달 여력은 MSFT +19.6 · **ORCL −1.9**(직전 분기 −11.5) · **CRWV −5.7**(직전 −4.7)로 악화 중. ⚠⚠ **분기값은 원자료가 아니라 복원한 값이다.** SEC의 10-Q 현금흐름표는 연초누계라, 같은 회계연도 시작일을 공유하는 사실들을 end 순으로 연속 차분해 만든다. **fetcher가 「분기합 = 연간」을 자동 검사해** 2% 넘게 어긋나면 오류란에 경고를 띄운다 — 그 경고가 뜨면 수치를 인용하지 말 것. 현재 6개사 전부 오차 0.0%. ⚠ 회계연도 종료월이 달라 ORCL은 2·5·8·11월 마감이다 — 같은 줄이어도 분기 경계가 다르다. ⚠ 분기는 계절성이 있다(4분기 집중) — 전분기 대비보다 **전년동분기 대비**로 읽을 것'
