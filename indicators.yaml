# Macro Data Book 지표 → API 매핑 (SSOT) — 최종본 v2 (학회 4팀 재편)
# 팀원 macro-databook v1(A·B·C, D제외)을 학회 현재 구조로 재편:
#   team_1 = 성장·경기 (+구리)   team_2 = 물가·정책·금리 (+유가·가스)
#   team_3 = 유동성·신용·심리 (+금·은)   team_4 = 글로벌·지정학·무역 (니치원자재·운임·무효화트리거)
# tier: 1 = 해석 필수 / 2 = 수치 인용만
# method: api | scrape | manual | derived
#
# ★ 팀원 v1의 검증된 코드는 그대로 보존(ECOS/KOSIS/data_go_kr 실호출 확인분).
#   재편은 "팀 재배치 + 원자재/CLI/4팀 신규"만. 신규는 대부분 기존 fred/yahoo_finance fetcher 재사용 → 새 코드 최소.
# ⚠ "확인" 표시 series/코드는 최초 실행 시 실제 API로 검증할 것.

sources:
  fred:
    base_url: https://api.stlouisfed.org/fred/series/observations
    auth: FRED_API_KEY
  ecos:
    base_url: https://ecos.bok.or.kr/api/StatisticSearch
    auth: ECOS_API_KEY
  kosis:
    base_url: https://kosis.kr/openapi/Param/statisticsParameterData.do
    auth: KOSIS_API_KEY
  fiscaldata:
    base_url: https://api.fiscaldata.treasury.gov/services/api/fiscal_service
    auth: none
  treasurydirect:
    base_url: https://www.treasurydirect.gov/TA_WS/securities
    auth: none
  cftc_socrata:
    base_url: https://publicreporting.cftc.gov/resource
    auth: none
  coingecko:
    base_url: https://api.coingecko.com/api/v3
    auth: none
  defillama:
    base_url: https://stablecoins.llama.fi
    auth: none
  upbit:
    base_url: https://api.upbit.com/v1
    auth: none
  binance:
    base_url: https://api.binance.com/api/v3
    auth: none
  data_go_kr:
    base_url: https://apis.data.go.kr
    auth: DATA_GO_KR_KEY
  yahoo_finance:
    base_url: https://query1.finance.yahoo.com/v8/finance/chart
    auth: none
    note: 팀원 v1이 MOVE·SKEW에 이미 사용 중 — 원자재·선물지수 심볼도 동일 fetcher 재사용
  worldbank:
    base_url: https://api.worldbank.org/v2/country
    auth: none
    note: 키 불필요·무료. 비OECD국(사우디·UAE·카자흐·나이지리아·튀르키예) GDP·CPI — 단 연간 데이터만
  dbnomics:
    base_url: https://api.db.nomics.world/v22/series
    auth: none
    note: 무료 애그리게이터(93개 기관) — 중국 NBS PMI·M2, ECB M3 등. 시리즈 코드는 db_series로 지정
  eurostat:
    base_url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data
    auth: none
    note: EU 공식 배포 API(JSON-stat). dataset + filters로 지정, time 외 모든 차원을 값 1개로 좁힐 것.
      유로존 집계는 EA21(2026-01 불가리아 가입) — EA20/EA19는 2025-12에서 끊긴다
  ecb:
    base_url: https://data-api.ecb.europa.eu/service/data
    auth: none
    note: ECB Data Portal SDMX-JSON. ecb_key = 'DATASET/SERIES_KEY'. 정책금리·€STR은 당일 반영,
      단 ICP(HICP) 계열은 2025-12에서 멈춰 있으므로 물가는 Eurostat ei_cphi_m을 쓸 것
  bcb:
    base_url: https://api.bcb.gov.br/dados/serie
    auth: none
    note: 브라질중앙은행 SGS — Selic 등, sgs 번호로 지정
  fed_rss:
    base_url: https://www.federalreserve.gov/feeds
    auth: none
    note: FOMC 보도자료(press_monetary)·연설(speeches) RSS — 제목·날짜·링크 자동
  boj_stat:
    base_url: https://www.stat-search.boj.or.jp
    auth: none
    note: 일본은행 통계 페이지 스크레이프 (M2 전년비)
  cboe:
    base_url: https://www.cboe.com/us/options/market_statistics/daily/
    auth: none
    note: Put/Call 일일 통계 페이지 파싱
  eia:
    base_url: https://api.eia.gov/v2
    auth: EIA_API_KEY
    note: 미설정 시 DEMO_KEY 폴백(레이트리밋) — eia.gov/opendata 무료 발급 권장
  opinet:
    base_url: https://www.opinet.co.kr/api
    auth: OPINET_API_KEY
    note: 국내 유가 — opinet.co.kr 오픈API 무료 즉시 발급

# ═════════════════════ team_1 : 성장·경기 (Growth & Cycle) ═════════════════════
team_1:
  - name: 실질 GDP
    tier: 2
    method: api
    source: fred
    series_id: GDPC1
  - name: GDPNow
    tier: 1
    method: api
    source: fred
    series_id: GDPNOW
  - name: OECD 경기선행지수 CLI (미국)
    max_age_days: 120   # OECD CLI는 참조월 +2~3개월 공표
    unit: "지수(100=추세)"
    tier: 2
    method: api
    source: dbnomics
    db_series: OECD/DSD_STES@DF_CLI/USA.M.LI.IX._Z.AA.IX._Z.H
    db_labels: ["미국 CLI (진폭조정, 100=추세)"]
    note: 확인 완료(2026-08-26, 최신 2026-05) — FRED USALOLITONOSTSAM은 OECD MEI 폐지로 2024-01에서 정지.
      OECD 신규 데이터셋(DSD_STES) 원천으로 교체. 2년 7개월치 공백이 이걸로 메워진다
  - name: OECD 경기선행지수 CLI (한국·중국)
    max_age_days: 120   # 위와 같음
    unit: "지수(100=추세)"
    tier: 2
    method: api
    source: dbnomics
    db_series:
      - OECD/DSD_STES@DF_CLI/KOR.M.LI.IX._Z.AA.IX._Z.H
      - OECD/DSD_STES@DF_CLI/CHN.M.LI.IX._Z.AA.IX._Z.H
    db_labels: ["한국 CLI", "중국 CLI"]
    note: 확인 완료(2026-08-26, 최신 2026-05) — FRED 미러(KOR/CHNLOLITONOSTSAM) 2024-01 정지분 교체.
      중국 CLI는 공식 PMI가 미러 정지 상태라 당분간 중국 경기의 1차 판정선 역할을 한다
  - name: ISM 제조업/서비스업 PMI
    unit_check: skip   # 뉴스 헤드라인 — 값이 문자열이라 단위 개념이 없다
    tier: 1
    method: news
    news_queries: ["ISM manufacturing PMI report", "ISM services PMI report"]
    note: >-
      자동 헤드라인(2026-07-20, Google News)으로 전환 — ISM 원자료 자체는 유료(licensed)라 공식 API 없고
      DBnomics·investing.com·FRED 경로 전부 막힘(상세 이력 하단). 뉴스 헤드라인엔 보통 발표 수치가 그대로
      실리므로(예: "ISM Manufacturing PMI rises to 53.3") 실질적 대체 가능 — 단 원문 대조 권장.
      [이력] DBnomics ISM/pmi/pm 2025-09부터 피드 파손(값이 10대로 붕괴, PMI 정상범위 30~70 위반).
      investing.com 403(Cloudflare)·tradingeconomics 무료키 410 폐지·FRED는 라이선스로 시리즈 삭제.
  - name: 지역 연준 제조업지수 (필라델피아·뉴욕·댈러스)
    tier: 1
    method: api
    source: fred
    series_id: [GACDFSA066MSFRBPHI, GACDISA066MSFRBNY, BACTSAMFRBDAL]
    note: 확인 완료(2026-08-26) — 필라델피아 2026-08 47.4 · 엠파이어 2026-08 20.6 · 댈러스 2026-07 1.3.
      ISM은 유료라 위 항목이 뉴스 헤드라인뿐인데, 이 셋은 무료이고 오히려 ISM보다 먼저 나온다.
      ⚠ 확산지수(증가-감소 응답 순차)라 ISM의 50 기준선과 스케일이 다르다 — 0이 중립선이며
      수준을 ISM처럼 읽으면 안 되고 방향·전환점만 쓴다.
      ⚠ 지역 편중(북동부·텍사스)이 있어 전국 대표성은 ISM보다 약하다.
      캔자스시티·리치먼드 연준 지수는 FRED에서 서베이 계열을 찾지 못했다(2026-08-26 검색, 고용 계열만 반환)
  - name: 지역 연준 제조업 평균 (ISM 대용)
    tier: 1
    method: derived
    formula: (필라델피아 + 엠파이어 + 댈러스) ÷ 3 — 위 항목에서 이미 수집
    note: 0이 중립. 단순평균이라 가중치 근거가 없다 — ISM 대체가 아니라 방향 확인용 보조선으로만 쓴다.
      세 지수의 기준월이 어긋나면(댈러스가 한 달 늦는 경우가 있다) 계산하지 않고 실패로 표시한다
  - name: 산업생산
    tier: 2
    method: api
    source: fred
    series_id: INDPRO
  - name: NFP (비농업 고용)
    vault_node: 실업률
    tier: 1
    method: api
    source: fred
    series_id: PAYEMS
  - name: 실업률
    tier: 1
    method: api
    source: fred
    series_id: UNRATE
  - name: 경제활동참가율
    tier: 2
    method: api
    source: fred
    series_id: CIVPART
  - name: 생산가능인구 (CNP16OV)
    tier: 2
    method: api
    source: fred
    series_id: CNP16OV
    note: 확인 완료(2026-08-26, 2026-07 275,282천) — 실업률 하락이 취업 때문인지 노동시장
      이탈 때문인지 가르는 분모. 이게 없으면 실업률 변화를 분해할 수 없다
  - name: 경제활동인구 (CLF16OV)
    tier: 2
    method: api
    source: fred
    series_id: CLF16OV
    note: 확인 완료(2026-08-26, 2026-07 169,094천) — 참가율 × 생산가능인구. 아래 분해 파생의 입력
  - name: 실업률 변화 분해 (취업 기여 vs 참가율 기여)
    tier: 1
    method: derived
    formula: 실업률 변화를 참가율 고정 반사실과 대조 — 참가율이 전월 그대로였다면 실업률이 얼마였을까
    note: 2026-07 실업률 4.1%는 5개월 연속 개선이지만 같은 기간 참가율이 61.9→61.4로 떨어졌다.
      "고용이 늘어서 내린 것"과 "구직을 포기해서 내린 것"은 정책 함의가 정반대다.
      Sahm Rule은 실업률 하나만 보므로 이 구분을 통과시킨다 — 반사실 계산이 필요한 이유
  - name: 주간 근로시간 (AWHAETP)
    tier: 2
    method: api
    source: fred
    series_id: AWHAETP
    note: 확인 완료(2026-08-26, 2026-07 34.3시간) — 기업은 해고보다 시간을 먼저 줄인다.
      임시직(TEMPHELPS)과 함께 고용 둔화의 선행 신호로 본다
  - name: JOLTS 구인건수
    max_age_days: 120   # BLS JOLTS는 참조월 +2개월 발표. 원본 정상(갱신 2026-08-04)
    vault_node: 실업률
    tier: 1
    method: api
    source: fred
    series_id: JTSJOL
    note: 'v/u 비율의 분자. 2026-08-12 tier 2→1 승격 — Bernanke & Blanchard(2023): 2021년 연준과 비판자가 똑같이 실업률·총고용을 보다가 과열을 놓쳤고, 과열을 드러낸 것은 v/u였다'
  - name: 실업자 수 (v/u 분모)
    tier: 2
    method: api
    source: fred
    series_id: UNEMPLOY
    note: 'v/u 비율의 분모. 단위 천명 — JTSJOL과 같은 단위라 그대로 나눌 수 있다'
  - name: v/u 비율 (구인/실업자, 노동시장 과열)
    tier: 1
    method: derived
    formula: JTSJOL ÷ UNEMPLOY (둘 다 천명 단위, FRED)
    note: 'Bernanke & Blanchard(2023) 핵심 변수. **실업률로는 과열이 보이지 않는다** — 실업률은 분모(경제활동인구)에 민감해 노동공급 축소로 생긴 과열을 완화로 읽는다. v/u는 수요÷공급 비율이라 이 함정을 피한다. BB 모형에서 노동시장 충격은 상품시장 충격보다 작지만 **지속성이 길어** 정책 반응을 요구한다. 2001년 이전은 Barnichon(2010) 보간이 필요하나 FRED 계열만으로 2001~ 구간은 산출 가능. ⚠ JOLTS 구인건수 자체의 측정 문제(허수 공고)는 BB가 다루지 않는다'
  - name: 신규 실업수당 청구건수
    tier: 1
    method: api
    source: fred
    series_id: ICSA
  - name: 시간당 임금 (AHE)
    tier: 2
    method: api
    source: fred
    series_id: CES0500000003
    note: 물가(team_2 단위노동비용)와 교차
  - name: 고용비용지수 (ECI)
    tier: 2
    method: api
    source: fred
    series_id: ECIALLCIV
  - name: Sahm Rule
    tier: 2
    method: api
    source: fred
    series_id: SAHMREALTIME
  - name: 소매판매
    tier: 2
    method: api
    source: fred
    series_id: RSAFS
    note: ⚠ 명목이다. 물가가 오르면 실질 소비가 줄어도 늘어난 것처럼 보인다 — 아래 실질 계열과 반드시 함께 볼 것
  - name: 실질 소매판매 (RRSFS)
    tier: 1
    method: api
    source: fred
    series_id: RRSFS
    note: 확인 완료(2026-08-26, 2026-07 229,439) — 명목 RSAFS를 대체하는 게 아니라 병치한다.
      "명목은 늘었는데 실질은 줄었다"가 보여야 소비 판단이 인플레에 오염되지 않는다
  - name: 미시간 소비자심리
    max_age_days: 120   # 월중 예비치·확정치 2단계라 확정 반영이 늦다. 원본 정상
    tier: 2
    method: api
    source: fred
    series_id: UMCSENT
  - name: 카드 연체율
    tier: 2
    method: api
    source: fred
    series_id: DRCCLACBS
    note: 분기
  - name: 초과저축 소진
    unit_check: skip   # 뉴스 헤드라인 — 값이 문자열이라 단위 개념이 없다
    tier: 2
    method: news
    news_queries: ["San Francisco Fed excess savings household"]
    note: 자동 헤드라인(2026-07-20, Google News) — SF Fed 추정치는 비정기 블로그 발행이라 구조화 API 없음. 최신 리포트 헤드라인으로 대체
  - name: 설비투자 (코어 자본재 수주)
    tier: 2
    method: api
    source: fred
    series_id: NEWORDER
  - name: 미국 TFP (Fernald, 가동률 조정)
    tier: 1
    method: api
    source: frbsf_tfp
    columns: [dLP, dtfp, dtfp_util, dk]
    points: 4
    vault_node: 총요소생산성 (TFP)
    note: 'DataBook에 **생산성 지표가 없던 공백**을 메운다. RegimeView 2기둥("생산성이 모순을 해소한다", 확신도 상)이 생산성 위에 서 있는데 근거 데이터가 수집되지 않고 있었다. **핵심은 dLP와 dtfp_util을 갈라 보는 것** — 노동생산성(dLP)은 자본심화(dk)만으로도 오른다. 기술 개선 여부는 TFP(dtfp), 경기적 가동률을 걷어낸 것은 가동률조정 TFP(dtfp_util)로 본다. Fernald(2014, FRBSF WP 2012-19)가 Basu-Fernald-Kimball(2006) 방법으로 구현한 표준 계열. ⚠ 분기 데이터이고 BEA 개정에 따라 **과거치가 소급 수정**된다 — 주간 트리거 불가. 가동률 조정은 모형 기반 추정이라 BFK 가정에 의존. 미국 business sector 기준이라 **BLS 비농업 노동생산성과 정의가 다르다**(섞지 말 것). 2026:Q2 기준 dLP +1.20 · dtfp −0.34 · **dtfp_util −2.19** · dk +3.19 — 노동생산성은 오르는데 기술은 안 좋아지고 있다'
  - name: 재고 사이클 (재고/판매 비율)
    max_age_days: 120   # Census 재고는 참조월 +2개월. 원본 정상
    tier: 2
    method: api
    source: fred
    series_id: ISRATIO
    # 볼트의 [[원자재 재고]]는 LME 구리 등 실물 원자재 재고 노드다.
    # 여기 ISRATIO는 기업 재고/판매 비율이라 다른 개념 — 자동 매칭을 끈다.
    vault_node: "-"
  - name: 기업이익
    tier: 2
    method: api
    source: fred
    series_id: CP
