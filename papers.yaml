# 발표자료에 붙일 논문 계수 등록부
#
# 왜 파일로 두나 — 계수를 사람(또는 AI) 기억에 맡기면 매주 빠진다.
# 실제로 2026-08-30 세션에서 지표 331개 중 21개만 쓰고 문헌은 제목만 인용한 판이 나왔다.
# `databook report`가 축마다 여기서 문헌을 꺼내 스캐폴드에 박아 넣는다.
#
# 규칙
#  - **계수 없이 등재하지 않는다.** "이 논문은 X가 중요하다고 했다"는 인용이 아니다.
#  - `apply`에 **이 자료의 숫자에 어떻게 곱하는지**를 적는다. 방향만 쓰면 소용없다.
#  - `caveat`에 표본·전용 한계를 적는다. 이게 없으면 계수를 남용하게 된다.
#  - 볼트 제텔에서 옮겨온 것은 `zettel`에 원 노트를 적어 되짚을 수 있게 한다.

credit:
  - id: gz2012
    cite: "Gilchrist & Zakrajšek(2012), NBER WP 17021 / AER 102(4), 표2"
    claim: "신용스프레드의 실물 예측력은 기대부도 성분이 아니라 초과채권프리미엄(EBP)에 있다."
    coef: "EBP +100bp → 4분기 실질GDP −1.5%p 이상 / 기대부도 성분은 −0.5%p — 3배 차이"
    apply: "현재 EBP에 −1.5를 곱해 4분기 GDP 기여를 자릿수로 읽는다"
    caveat: "표본 1973–2010. 부호를 뒤집어 순풍으로 읽는 것은 원 논문이 검증한 방향이 아니다 — 크기가 아니라 자릿수로만"
    zettel: "신용스프레드의 정보는 기대부도가 아니라 잔차에 있다"
    series: [EBP, GZ 신용스프레드]

  - id: vix_repl
    cite: "자체 재현(2026-07) — FRED 원자료, vix_default_premium_replication.py"
    claim: "VIX와 Baa−10Y 스프레드의 관계는 재현된다."
    coef: "α₁ = 1.6705 (SE 0.1025, R² = 0.693, 2008.01–2017.12 월별) → VIX 1% 상승 = 약 +1.7bp"
    apply: "현재 VIX가 설명하는 스프레드를 계산해 실제와 비교한다 — 잔차가 압축의 크기다"
    caveat: "원 논문 서술(2.3802%p)이 아니라 재계산값. 절편은 표본에서 다시 추정해야 한다"
    series: [VIX, 신용스프레드 장기 대용]

  - id: choi2023
    cite: "최재용(2023), 글로벌 회사채 신용위험"
    claim: "신용스프레드의 조기경보 유효기간은 2주다."
    coef: "유의 시차 −10영업일에서 최대, −12일 이후 전부 비유의"
    apply: "스프레드 변화를 2주 내 실행 가능한 행동과만 짝짓는다"
    caveat: "표본이 사후 선정(OAS>500bp·BBB↓). −1·−3·−5·−7~−9일도 비유의라 꾸준한 선행이 아니다"
    zettel: "신용스프레드의 조기경보 유효기간은 2주다"
    series: [HY 스프레드, IG 스프레드]

rates:
  - id: kim2024
    cite: "김석진(2024), 거시경제 요인과 Dynamic Nelson-Siegel 모형을 고려한 미 국채 기간구조 분석"
    claim: "충격은 만기별로 분업한다."
    coef: "물가 요인은 10년물에, 실물 요인은 1~5년물에 선행성"
    apply: "짧은 쪽이 먼저 올랐으면 경기, 긴 쪽이 먼저면 물가로 읽는다"
    caveat: "선행성이지 인과 식별이 아니다"
    zettel: "물가 압력은 장기금리로, 실물은 단기금리로 — 충격은 만기별로 분업한다"
    series: [미 국채 2Y, 미 국채 10Y, BEI 10Y, 5y5y 포워드 기대인플레]

  - id: lee2023
    cite: "이명수(2023), 인플레이션 기대와 주택가격 간의 관계 — 한국과 미국"
    claim: "기대인플레가 물가로 이어지는 고리는 나라마다 다르다."
    coef: "기대 → CPI 인과검정: 미국 F=10.80(1% 유의) / 한국 F=0.58(기각). BEI↑ → 실질금리↓ 한 −0.1 / 미 −0.49"
    apply: "5y5y 움직임을 미국 물가 경로에는 쓰되 한국 기대인플레에 옮기지 않는다"
    caveat: "표본기간 상이. 집값→기대 F=2.53(한국 5% 유의)은 별개 경로다"
    zettel: "집값이 기대를 통해 물가로 전이된다"
    series: [5y5y 포워드 기대인플레, 한국 기대인플레이션]

korea:
  - id: pyo2016
    cite: "표상원(2016), 미국 기준금리 인상이 국내경제에 미치는 영향 — FAVAR"
    claim: "한국의 인상은 경기 대응이 아니라 환율 제약에 대한 뒤늦은 반응이다."
    coef: "미국 인상 → 한국은 즉시 추종하지 않음. 자본유출·환율 상승 뒤에 인상. 시점이 제조업 바닥 통과와 겹친다"
    apply: "한은 인상을 경기 과열 신호로 읽지 않는다 — 바닥 통과 신호에 가깝다"
    caveat: "FAVAR 식별 가정에 의존. 시점 겹침이 인과는 아니다"
    zettel: "한국의 금리 인상은 경기 대응이 아니라 환율 제약에 대한 뒤늦은 반응이다"
    series: [한국은행 기준금리, 원/달러, 한국 산업활동동향]

  - id: joo2024
    cite: "주현도(2024), 부문별 인플레이션을 이용한 테일러 준칙 추정, 경제학연구 72(4)"
    claim: "한은 반응함수는 좌우가 대칭이 아니다."
    coef: "물가가 목표를 웃돌 때는 물가만, 밑돌 때는 성장을 본다 — 보는 대상이 국면에 따라 바뀐다"
    apply: "현재 기대인플레가 목표 위인지 아래인지로 한은이 무엇을 볼지 판정한다"
    caveat: "국면 분할이 사후적일 수 있다"
    zettel: "한은은 물가 하회 시엔 성장을 보고 상회 시엔 물가를 본다"
    series: [한국은행 기준금리, 한국 기대인플레이션, 한국 CPI]

  - id: kospi_fx
    cite: "이상원(2010) 국제투자심리지표간의 연관성 · Kang·Choi·Yoon(2014) The Impact of Global Volatility on Asian Financial Markets"
    claim: "위험 이벤트에서 원화는 안전통화가 아니라 위험통화다."
    coef: "VIX 상승 시 원화 절하 −0.0993 / 엔화 절상 −0.0767 — 방향이 반대이고 원화 민감도가 엔의 3.5배"
    apply: "VIX 변화에 원화와 엔화를 같은 방향으로 놓지 않는다"
    caveat: "표본기간 2008 전후 위기 구간 포함 — 평시 민감도는 더 낮을 수 있다"
    series: [VIX, 원/달러, 엔/달러]

  - id: foreign_flow
    cite: "KOSPI 노드 판정 규칙 (2026-08-18 재측정)"
    claim: "외국인 순매수는 주가를 '못 움직인다'가 아니라 '덜 움직인다'."
    coef: "외국인 → KOSPI F=9.03 (1% 유의). 방향은 유의하나 크기가 작다"
    apply: "수급을 가격의 원인으로 쓰되 반드시 크기를 병기한다"
    caveat: "역방향(주가→외국인) 검정을 함께 보지 않으면 인과 방향을 못 가린다"
    zettel: "외국인 순매수는 환율을 움직이지만 주가는 못 움직인다"
    series: [외국인 수급, 코스피·코스닥 지수]

prices:
  - id: ballmankiw1995
    cite: "Ball & Mankiw(1995/NBER WP 4168), QJE 110(1)"
    claim: "코어물가는 공급충격을 걸러내는 열등한 방법이다."
    coef: "메뉴비용 하에서 총물가는 상대가격 변화 분포의 왜도에 의존 — 품목 지목(코어)이 아니라 꼬리 제거(중위·절사평균)가 맞다"
    apply: "헤드라인·코어 대신 절사평균·중위를 함께 본다"
    caveat: "중위·절사평균 CPI(Cleveland)는 **월간 변화율의 연율**이라 YoY 지표와 같은 표에 놓으면 안 된다"
    zettel: "코어물가는 공급충격을 걸러내는 열등한 방법이다 — 중위·절사평균이 낫다"
    series: [절사평균 PCE, 중위 CPI, PCE (헤드라인 / 코어)]

  - id: china_ppi
    cite: "볼트 판정 규칙 — 중국의 디플레 수출은 소비재 PPI로 판정한다"
    claim: "전체 PPI로는 대외 디플레 압력을 못 본다."
    coef: "2026-07 전체 +3.5% = 生产资料 +4.8%(기여 +3.72%p) + 生活资料 −0.8%(−0.17%p)"
    apply: "전체가 플러스여도 生活资料가 마이너스면 디플레 수출은 살아 있다고 판정한다"
    caveat: "NBS 원문 직독(source=nbs). DBnomics 미러는 2026-02에서 멈춰 부호가 반대다"
    series: [중국 PPI]

labor:
  - id: bb2023
    cite: "Bernanke & Blanchard(2023), NBER WP 31417"
    claim: "노동시장 과열은 실업률로는 보이지 않는다."
    coef: "봐야 하는 것은 v/u(구인/실업자). 가격·임금·기대 방정식 계수는 팬데믹 전후로 매우 유사 — 관계는 안 깨졌다"
    apply: "실업률 대신 v/u로 과열을 판정하고, 실업률 변화는 참가율 기여를 분해해서 읽는다"
    caveat: "확신도 중상. 저자 진술과 계수 안정성으로 뒷받침되나 구조 변화 검정은 아니다"
    zettel: "실업률로는 노동시장 과열이 보이지 않는다 — v_u를 봐야 한다"
    series: [v/u 비율, 실업률, 경제활동참가율, 실업률 변화 분해]

liquidity:
  - id: song2019
    cite: "송종운(2019), 연준의 공개시장운영 여건의 변화와 다중 기준금리체계, 마르크스주의 연구 16(3)"
    claim: "정책금리 통제력은 지준 수급 구조에 조건부다."
    coef: "2010년 3분기에 지준 공급이 수요를 넘어섰고 전통적 공개시장운영은 그 시점에 작동을 멈췄다"
    apply: "RRP·지준이 마르는 국면에서만 EFFR−IORB가 신호가 된다 — 완충이 있는 동안은 가격이 안 움직인다"
    caveat: "제도 서술이지 계량 추정이 아니다"
    zettel: "정책금리 통제력은 지준 수급 구조에 조건부다"
    series: [EFFR - IORB 스프레드, 은행 지준, RRP 잔고, 순유동성]

geopolitics:
  - id: gpr_rule
    cite: "[[지정학적 리스크]] 노드 판정 규칙 · 제텔 소환 인덱스 §1"
    claim: "월간 지수는 사건 대응에 느리다 — 가격이 먼저다."
    coef: "층위: GPR(월간) → 뉴스(일간) → 가격 반응(실시간). 가격 3종(유가·금·VIX)의 동시 급변이 GPR 수준보다 빠르다"
    apply: "GPR로 당장의 국면을 판단하지 않는다. 유가·금·VIX가 같은 방향인지를 먼저 본다"
    caveat: "**금지 규칙이다.** GPR 하락을 '충격이 물러난다'의 근거로 쓰면 규칙 위반"
    series: [유가 WTI, 금, VIX, 지정학위험지수 GPR]

  - id: inventory_rule
    cite: "[[원자재 재고]] 판정 규칙 · 제텔 소환 인덱스 §1"
    claim: "가격 변화의 원인은 재고 방향이 가른다."
    coef: "가격↓ + 재고↑ = 공급 요인 / 가격↓ + 재고↓ = 수요 요인"
    apply: "유가가 내렸을 때 미 원유재고·생산을 함께 보고 공급/수요를 가른다"
    caveat: "주간 재고는 변동이 커 한 주로 판정하지 않는다"
    series: [미 원유재고, 미 원유생산, 유가 WTI]

  - id: copper_gate
    cite: "[[구리 가격]] 「'급락'의 임계」 · 제텔 소환 인덱스 §1"
    claim: "구리는 급락기에만 경기를 말한다."
    coef: "직전 12개월 최고치 대비 −35% 미만이면 성장 신호로 쓰지 않는다"
    apply: "게이트가 닫혀 있으면 구리 등락을 성장 서사에 넣지 않는다"
    caveat: "완만한 등락의 지배 성분은 경기가 아니라 인플레·환율·투기·재고다"
    zettel: "Dr. Copper는 급락기에만 경기를 말한다"
    series: [구리]
